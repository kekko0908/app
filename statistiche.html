<!DOCTYPE html>
<html lang="it" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { padding-top: 80px; }
        .chart-wrapper {
            background: var(--bs-body-bg);
            border-radius: .5rem;
            box-shadow: 0 0 1rem rgba(0,0,0,0.1);
            padding: 1rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Patrimonio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="statistiche.html">Statistiche</a></li>
        <li class="nav-item"><a class="nav-link" href="transazioni.html">Transazioni</a></li>
      </ul>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="darkSwitch">
        <label class="form-check-label" for="darkSwitch">Dark</label>
      </div>
    </div>
  </div>
</nav>
<div class="container">
  <h1 class="mb-4">Statistiche</h1>
  <div class="mb-3">
    <label for="rangeSelect" class="form-label">Intervallo</label>
    <select id="rangeSelect" class="form-select w-auto d-inline-block">
      <option value="7">1 settimana</option>
      <option value="30">1 mese</option>
      <option value="180">6 mesi</option>
      <option value="365">1 anno</option>
    </select>
  </div>
  <div class="row mb-3" id="totals">
    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h6 class="card-title">Entrate</h6>
          <p id="totEntrate" class="h5 mb-0">€0</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h6 class="card-title">Uscite</h6>
          <p id="totUscite" class="h5 mb-0">€0</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h6 class="card-title">Flusso di cassa</h6>
          <p id="totFlusso" class="h5 mb-0">€0</p>
        </div>
      </div>
    </div>
  </div>
  <p id="compareInfo" class="text-center text-muted small mb-3"></p>
  <div class="chart-wrapper mb-4">
    <canvas id="statsChart" height="120"></canvas>
  </div>
  <div class="chart-wrapper mb-4">
    <canvas id="flowChart" height="120"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const darkSwitch = document.getElementById('darkSwitch');
const rangeSelect = document.getElementById('rangeSelect');
const ctx = document.getElementById('statsChart');
const flowCtx = document.getElementById('flowChart');
const transactions = JSON.parse(localStorage.getItem('transactions') || '[]');
let chart, flowChart;
const navbar=document.querySelector('.navbar');
function updateNavbarTheme(theme){
  navbar.classList.remove('navbar-light','bg-light','navbar-dark','bg-dark');
  if(theme==='dark') navbar.classList.add('navbar-dark','bg-dark');
  else navbar.classList.add('navbar-light','bg-light');
}

function prepareData(days){
  const now = new Date();
  const start = new Date(now.getTime()-days*24*60*60*1000);
  const map = {};
  transactions.forEach(t=>{
    const d = new Date(t.date);
    if(d<start || d>now) return;
    const key = d.toISOString().slice(0,10);
    if(!map[key]) map[key]={entrata:0, uscita:0};
    map[key][t.type]+=t.amount;
  });
  const labels=Object.keys(map).sort();
  const entrate=labels.map(l=>map[l].entrata);
  const uscite=labels.map(l=>map[l].uscita);
  return {labels,entrate,uscite};
}

function computeTotals(start, end){
  let entrata=0, uscita=0;
  transactions.forEach(t=>{
    const d=new Date(t.date);
    if(d>=start && d<=end){
      if(t.type==='entrata') entrata+=t.amount; else uscita+=t.amount;
    }
  });
  return {entrata, uscita, flusso: entrata-uscita};
}

function render(days){
  const data=prepareData(days);
  const now=new Date();
  const start=new Date(now.getTime()-days*24*60*60*1000);
  const prevStart=new Date(now.getTime()-days*2*24*60*60*1000);
  const prevEnd=new Date(now.getTime()-days*24*60*60*1000);
  const totals=computeTotals(start,now);
  const prevTotals=computeTotals(prevStart,prevEnd);
  document.getElementById('totEntrate').textContent='€ '+totals.entrata.toFixed(2);
  document.getElementById('totUscite').textContent='€ '+totals.uscita.toFixed(2);
  document.getElementById('totFlusso').textContent='€ '+totals.flusso.toFixed(2);
  const diff=totals.flusso-prevTotals.flusso;
  const info=document.getElementById('compareInfo');
  info.textContent='Variazione vs periodo precedente: '+(diff>=0?'+':'')+diff.toFixed(2)+' €';

  if(chart) chart.destroy();
  if(flowChart) flowChart.destroy();

  chart=new Chart(ctx,{
    type:'line',
    data:{
      labels:data.labels,
      datasets:[
        {label:'Entrate',data:data.entrate,borderColor:'green',backgroundColor:'rgba(0,128,0,0.2)',tension:0.2},
        {label:'Uscite',data:data.uscite,borderColor:'red',backgroundColor:'rgba(255,0,0,0.2)',tension:0.2}
      ]
    },
    options:{scales:{y:{beginAtZero:true}}}
  });

  const cash=data.labels.map((_,i)=>data.entrate[i]-data.uscite[i]);
  flowChart=new Chart(flowCtx,{
    type:'bar',
    data:{
      labels:data.labels,
      datasets:[{label:'Flusso di cassa',data:cash,backgroundColor:'steelblue'}]
    },
    options:{scales:{y:{beginAtZero:true}}}
  });
}

rangeSelect.addEventListener('change',()=>render(parseInt(rangeSelect.value)));

const savedTheme=localStorage.getItem('theme')||'light';
document.documentElement.setAttribute('data-bs-theme',savedTheme);
darkSwitch.checked=savedTheme==='dark';
updateNavbarTheme(savedTheme);

darkSwitch.addEventListener('change',()=>{
  const theme=darkSwitch.checked?'dark':'light';
  document.documentElement.setAttribute('data-bs-theme',theme);
  localStorage.setItem('theme',theme);
  updateNavbarTheme(theme);
});

render(parseInt(rangeSelect.value));
</script>
</body>
</html>
